<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Diamante | AR</title>
    <link href="./css/output.css" rel="stylesheet">

    <script src="./js/libs/aframe.min.js"></script>
    <script src="./js/libs/mindar-image-aframe.prod.js"></script>

    <style>
        video, canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
    </style>
</head>

<body class="bg-[#1a1a1a] min-h-screen font-sans overflow-hidden">

    <div id="header-superior"></div>

    <div id="ar-ui" class="absolute top-0 left-0 w-full h-full pointer-events-none z-40 flex flex-col items-center justify-between pb-28 pt-12">
        <div class="bg-black/50 backdrop-blur-md px-6 py-2 rounded-full border-white/20 shadow-lg">
            <span id="ar-status" class="font-bold text-sm text-white">Escaneando logo...</span>
        </div>

        <div id="ar-result" class="hidden bg-white text-[#2b2b31] px-8 py-6 rounded-[2rem] shadow-2xl flex-col items-center gap-2 w-10/12 pointer-events-auto transition-all transform translate-y-10 opacity-0 duration-300">
            <p class="text-xs text-gray-500 font-bold uppercase tracking-wider">Objeto detectado</p>
            <h2 id="equipo-detectado" class="font-monument text-2xl uppercase tracking-tighter text-center text-[#008298]">Equipo</h2>
            <button class="mt-4 w-full bg-[#f27b21] text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform">
                Reclamar Carta
            </button>
        </div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./ar/targets.mind; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
        <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
    </a-scene>

    <div id="menu-inferior" class="z-50 relative pointer-events-auto"></div>

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/camara.js"></script>

</body>
</html>
