<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Zona Diamante</title>
        <link href="./css/output.css" rel="stylesheet">
    </head>
    <body class="bg-slate-900 min-h-screen">

        <div id="header-superior"></div>

        <main class="w-full min-h-screen flex flex-col pb-28">

            <div id="carrusel-container" class="w-full flex-grow bg-slate-800/50 rounded-b-[3rem] shadow-xl flex flex-col items-center justify-center animate-pulse">

            </div>
            
            <div class="w-full flex flex-col gap-4 mt-8 px-6">

                <button class="relative w-full bg-[#c8c8c8] text-[#2b2b31] font-bold text-sm py-3 rounded-3xl shadow-md flex items-center justify-center transition-transform hover:scale-[1.02]">
                    <span>Aprende más</span>

                    <svg class="absolute right-6" width="10" height="19" viewBox="0 0 10 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="12.0955" height="2.46847" rx="1.23423" transform="matrix(0.657285 0.753642 -0.657285 0.753642 1.65454 0)" fill="currentColor" fill-opacity="0.8"/>
                        <rect width="12.0955" height="2.46847" rx="1.23423" transform="matrix(0.657285 -0.753642 -0.657285 -0.753642 1.62231 18.4375)" fill="currentColor" fill-opacity="0.8"/>
                    </svg>
                </button>

                <button class="relative w-full bg-[#008298] text-white font-bold text-sm py-3 rounded-3xl shadow-md flex items-center justify-center transition-transform hover:scale-[1.02]">
                    <span>Partidos</span>

                    <svg class="absolute right-6" width="10" height="19" viewBox="0 0 10 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="12.0955" height="2.46847" rx="1.23423" transform="matrix(0.657285 0.753642 -0.657285 0.753642 1.65454 0)" fill="currentColor" fill-opacity="0.8"/>
                        <rect width="12.0955" height="2.46847" rx="1.23423" transform="matrix(0.657285 -0.753642 -0.657285 -0.753642 1.62231 18.4375)" fill="currentColor" fill-opacity="0.8"/>
                    </svg>
                </button>

            </div>

        </main>

        <div id="menu-inferior"></div>

        <script type="module" src="./js/main.js"></script>
    </body>
</html>
