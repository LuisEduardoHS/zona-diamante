<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión integral · Tailwind</title>
<style>body{font:14px system-ui;color:#12596a;margin:14px}button{padding:10px}pre{white-space:pre-wrap}iframe{display:block;width:390px;height:844px;border:1px solid #ccd}</style>
<p>Revisión local. Cuenta y cifras sintéticas. No se conecta a producción ni se solicita cámara.</p><label>Tamaño <select id="size"><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="844,390">844 × 390</option><option value="1440,900">1440 × 900</option></select></label> <button id="run">Comprobar secciones</button><pre id="status" role="status">Preparado</pre><iframe id="site" title="Sitio bajo prueba" src="/index.html"></iframe>
<script type="module">
const frame=document.querySelector('#site'),out=document.querySelector('#status'),d=()=>frame.contentDocument,q=s=>d().querySelector(s);
let errors=[];const check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';};
document.querySelector('#size').onchange=event=>{const [width,height]=event.target.value.split(',');frame.style.width=width+'px';frame.style.height=height+'px';};
async function wait(fn){const end=performance.now()+12000;while(!fn()){if(performance.now()>end)throw Error('Timeout');await new Promise(r=>setTimeout(r,25));}}
async function load(path,selector){frame.src=path;await new Promise(r=>frame.addEventListener('load',r,{once:true}));frame.contentWindow.addEventListener('error',e=>errors.push(e.message));await wait(()=>q(selector));await d().fonts.ready;}
async function go(selector,target){q(selector).click();await wait(()=>q(target)&&!q('#contenido-pagina[aria-busy]'));}
function layout(label){check(d().querySelectorAll('link[rel=stylesheet]').length===1,label+': una sola hoja Tailwind');check(d().documentElement.scrollWidth<=frame.clientWidth,label+': sin desbordamiento horizontal');}
document.querySelector('#run').onclick=async()=>{out.textContent='';errors=[];try{
 await load('/index.html','#carousel-dots button');layout('Inicio');const header=q('.site-header'),nav=q('.site-bottom-nav'),documentStart=d();
 q('[aria-label="Ver equipo Charros"]').click();await wait(()=>q('[data-slide]:not([inert]) h2')?.textContent.trim()==='Charros');check(true,'carrusel cambia de equipo');
 q('[data-slide]:not([inert]) a').click();await wait(()=>q('.equipo-hero h1'));await d().fonts.ready;layout('Equipo');check(q('.equipo-hero h1').textContent.includes('Charros'),'detalle corresponde al equipo');
 await go('.site-bottom-nav a[href$="Informacion.html"]','#historia-app');layout('Info');check(d()===documentStart&&q('.site-header')===header&&q('.site-bottom-nav')===nav,'SPA conserva documento y navegación');check(!q('[src*="historia-ilustracion"]'),'Info usa fotografía real y elimina la portada anterior');
 q('[data-era="expansion"].historia-filtro').click();check([...d().querySelectorAll('.historia-evento')].filter(n=>getComputedStyle(n).display!=='none').length===2,'filtro Expansión muestra dos etapas');
 q('[data-era="todas"].historia-filtro').click();check([...d().querySelectorAll('.historia-evento')].filter(n=>getComputedStyle(n).display!=='none').length===4,'Todas restaura las cuatro etapas');
 await go('.site-bottom-nav a[href$="trivia.html"]','.trivia-guest-actions');layout('Trivia invitado');
 await go('.site-bottom-nav a[href$="juego.html"]','#game-start:not(:disabled)');layout('Juego');check(!q('#game-top-collection'),'se elimina el diamante del encabezado del juego');
 check(getComputedStyle(q('.shell-brand')).visibility==='visible'&&q('.shell-brand').getAttribute('aria-label')==='Iniciar sesión','cuenta visible en el encabezado del juego');
 q('#game-start').click();const pause=q('#game-pause');await wait(()=>{const r=pause.getBoundingClientRect();return pause.contains(d().elementFromPoint(r.x+r.width/2,r.y+r.height/2));});check(true,'encabezado no bloquea el control de pausa');q('#game-pause').click();check(q('#game-beta').dataset.phase==='paused','pausa funciona con el CSS compartido');q('#game-resume').click();check(q('#game-beta').dataset.phase!=='paused','reanudar funciona');
 await go('.shell-brand','#login-form');layout('Login');check(!q('#game-beta'),'salir del juego desmonta la partida');
 await go('.auth-secondary','#crear-cuenta-form');layout('Registro');
 await load('/pages/auth/recuperar.html','#recuperar-form');layout('Recuperación');
 await load('/pages/auth/restablecer.html','#restablecer-form');layout('Restablecimiento');
 await load('/pages/coleccion/coleccion.html','.col-tile');layout('Colección');check(d().querySelectorAll('.col-tile').length===20,'catálogo completo');q('[data-type="mascot"]').click();check(d().querySelectorAll('.col-tile').length===4,'filtro de mascotas');q('.col-tile').click();check(q('#col-detail').open,'detalle de carta abre');q('#col-detail-close').click();check(!q('#col-detail').open,'detalle cierra');
 await load('/pages/contenido/Ayuda.html','.ayuda-pregunta');layout('Ayuda');const wasOpen=q('.ayuda-pregunta').open;q('.ayuda-pregunta summary').click();check(q('.ayuda-pregunta').open!==wasOpen,'acordeón de ayuda');
 await load('/pages/experiencias/juego.html?session=demo','#game-start:not(:disabled)');layout('Juego autenticado');check(q('.shell-brand').getAttribute('aria-label')==='Abrir mi perfil'&&q('.shell-account-avatar'),'perfil y avatar conservados en el juego');
 const account=q('.shell-brand'),profileDoc=d();await go('.shell-brand','#perfil-nombre');await wait(()=>q('#perfil-nombre').value==='Afición de prueba');layout('Perfil');check(d()===profileDoc&&q('.shell-brand')===account,'la navegación conserva el encabezado y la sesión');
 await go('.site-bottom-nav a[href$="trivia.html"]','#start-trivia');q('#start-trivia').click();await wait(()=>q('[data-option-id]'));
 for(let i=0;i<5;i++){await wait(()=>q('[data-option-id]:not(:disabled)'));q('[data-option-id]').click();await new Promise(r=>setTimeout(r,60));}
 await wait(()=>q('#submit-dialog')?.open);check(true,'trivia guarda cinco respuestas y abre confirmación');q('#confirm-submit').click();await wait(()=>q('#trivia-finale')?.open);check(true,'resultado de trivia conserva su presentación');q('#close-trivia-result').click();q('#close-trivia-result').click();check(q('#trivia-countdown'),'contador de siguiente trivia visible');
 await load('/__ar-style','#foto-preview[open]');await wait(()=>q('#foto-imagen').complete);layout('Foto AR simulada');check(getComputedStyle(q('a-scene')).position==='fixed','superficie AR conserva la posición de pantalla');q('#btn-cerrar-foto').click();check(!q('#foto-preview').open,'vista previa de foto cierra');
 check(errors.length===0,'sin errores JavaScript de las páginas');out.textContent+='TERMINADO\n';
 }catch(e){out.textContent+='FAIL '+e.stack+'\n'+errors.join('\n');}};
</script></html>
