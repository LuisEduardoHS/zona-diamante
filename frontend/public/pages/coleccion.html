<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/Collect-Style.css">
  <title>Colección de cartas</title>
</head>
<body>
  <main class="collection-page">
    <header class="hero">
      <div class="hero__orange"></div>
      <div class="hero__teal">
        <h1>Colección de cartas</h1>
      </div>
    </header>

    <section class="cards-grid" aria-label="Cartas de béisbol">
      <article class="player-card">
        <div class="trading-card trading-card--osuna">
          <img src="../assets/img/Cartas/CharrosC.png" alt="Carta coleccionable de Roberto Osuna" style="filter: grayscale(100%);">
        </div>
        <h2>Roberto Osuna<br><span>Charros</span></h2>
      </article>

      <article class="player-card">
        <div class="trading-card trading-card--loya">
          <img src="../assets/img/Cartas/DoradosC.png" alt="Carta coleccionable de Jesús Loya">
        </div>
        <h2>Jesús Loya<br><span>Dorados</span></h2>
      </article>

      <article class="player-card player-card--lower">
        <div class="trading-card trading-card--moore">
          <img src="../assets/img/Cartas/SultanesC.png" alt="Carta coleccionable de Eddie Moore"  style="filter: grayscale(100%);" >
        </div>
        <h2>Eddie Moore<br><span>Sultanes</span></h2>
      </article>

      <article class="player-card player-card--lower">
        <div class="trading-card trading-card--meza">
          <img src="../assets/img/Cartas/AlgodonerosC.png" alt="Carta coleccionable de Alfredo Meza" style="filter: grayscale(100%);">
        </div>
        <h2>Alfredo Meza<br><span>Algodoneros</span></h2>
      </article>
    </section>
  </main>
</body>
</html>
