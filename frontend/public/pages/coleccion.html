<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-naranja.svg">
  <link href="../css/output.css?v=20260922-4" rel="stylesheet">
  <link rel="stylesheet" href="../css/Collect-Style.css">
  <title>Colección de cartas | Zona Diamante</title>
</head>
<body>

  <!-- MENÚ SUPERIOR -->
  <div id="header-superior"></div>

  <main class="collection-page">
    <header class="hero">
      <div class="hero__orange"></div>
      <div class="hero__teal">
        <h1>Colección de cartas</h1>
      </div>
    </header>

    <section class="cards-grid" aria-label="Cartas de béisbol">
      <article class="player-card">
        <div class="trading-card trading-card--osuna">
          <img decoding="async" src="../assets/img/Cartas/CharrosC.webp" alt="Carta coleccionable de Roberto Osuna" style="filter: grayscale(100%);">
        </div>
        <h2>Roberto Osuna<br><span>Charros</span></h2>
      </article>

      <article class="player-card">
        <div class="trading-card trading-card--loya">
          <img decoding="async" loading="lazy" src="../assets/img/Cartas/DoradosC.webp" alt="Carta coleccionable de Jesús Loya">
        </div>
        <h2>Jesús Loya<br><span>Dorados</span></h2>
      </article>

      <article class="player-card player-card--lower">
        <div class="trading-card trading-card--moore">
          <img decoding="async" loading="lazy" src="../assets/img/Cartas/SultanesC.webp" alt="Carta coleccionable de Eddie Moore" style="filter: grayscale(100%);">
        </div>
        <h2>Eddie Moore<br><span>Sultanes</span></h2>
      </article>

      <article class="player-card player-card--lower">
        <div class="trading-card trading-card--meza">
          <img decoding="async" loading="lazy" src="../assets/img/Cartas/AlgodonerosC.webp" alt="Carta coleccionable de Alfredo Meza" style="filter: grayscale(100%);">
        </div>
        <h2>Alfredo Meza<br><span>Algodoneros</span></h2>
      </article>
    </section>
  </main>

  <!-- MENÚ INFERIOR -->
  <div id="menu-inferior"></div>

  <!-- JAVASCRIPT -->
  <!-- Las rutas son relativas a /pages/, por eso ../js/ -->
  <script type="module" src="../js/main.js?v=20260922-3"></script>

</body>
</html>
