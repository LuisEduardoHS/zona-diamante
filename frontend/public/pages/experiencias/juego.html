<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="../../assets/logo-naranja.svg">
    <title>Juego | Zona Diamante</title>
    <link href="../../css/output.css?v=20261101-unified" rel="stylesheet">
    <link href="../../css/juego-Style.css?v=20261101-unified" rel="stylesheet">
</head>
<body class="game-beta-page">
<div id="header-superior"></div>
<main id="game-beta" class="game-beta" data-screen="home">
    <a id="game-top-collection" class="game-collection-icon" href="../coleccion/coleccion.html" aria-label="Mi colección"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 5h16l6 8-14 17L2 13Z" fill="currentColor"/></svg></a>
    <div class="game-stage">
        <div id="game-field" class="game-field" tabindex="-1" aria-label="Campo de béisbol. Toca cualquier parte de la tarjeta o pulsa Espacio para batear.">
          <div id="game-scene" class="game-scene">
            <img class="game-stadium" src="../../assets/img/juego/estadio.png" alt="" aria-hidden="true">
            <div id="game-pitcher" class="game-pitcher" aria-hidden="true"><span class="game-pitcher-head"></span><span class="game-pitcher-body"></span><span class="game-pitcher-arm"></span><span class="game-pitcher-legs"></span></div>
            <div id="game-contact" class="game-contact" aria-hidden="true"><span></span></div>
            <div class="game-batter-shadow" aria-hidden="true"></div>
            <div id="game-batter" class="game-batter" role="img" aria-label="Bateador de Sultanes"></div>
            <div id="game-ball" class="game-ball" aria-hidden="true" hidden></div>
          </div>
        </div>
        <section data-game-screen="home" class="game-home" aria-label="Inicio del juego">
            <div class="game-cover-title"><h1 id="game-title" tabindex="-1">Juego</h1><span id="game-day-label">Reto de bateo</span></div>
            <div class="game-cover-actions"><button id="game-start" class="game-primary" type="button" disabled>Iniciar</button><span id="game-access-note" class="game-access-note">Práctica · sin puntos</span></div>
        </section>
        <section data-game-screen="play" class="game-play-screen" aria-label="Partida de práctica" hidden>
            <button id="game-hit" type="button" class="game-hit" aria-label="Batear" aria-describedby="game-bat-hint game-feedback" disabled></button>
            <div class="game-hud" aria-label="Marcador"><div><span>Hits</span><strong><span id="game-hits">0</span><small id="game-target">/5</small></strong></div><div><span>Tiros</span><strong id="game-progress">0/10</strong></div><div><span>Racha</span><strong id="game-streak">×0</strong></div></div>
            <div id="game-goal-progress" class="game-pitch-progress" role="img" aria-label="0 de 10 lanzamientos completados"></div>
            <span id="game-session-note" class="game-session-note">Práctica · sin puntos</span>
            <button id="game-pause" type="button" class="game-pause" aria-label="Pausar" aria-pressed="false"><span aria-hidden="true">Ⅱ</span></button>
            <div id="game-countdown" class="game-countdown" hidden><span>Prepárate</span><strong id="game-countdown-number">3</strong></div>
            <div class="game-controls"><p id="game-feedback" class="game-feedback" role="status" aria-live="polite">Prepárate</p><p id="game-bat-hint" class="game-bat-hint">Presiona para batear</p></div>
            <div id="game-paused" class="game-paused" hidden><strong>En pausa</strong><p>Reanuda cuando estés listo.</p><button type="button" id="game-resume" class="game-primary">Reanudar</button><button type="button" id="game-exit" class="game-text-button">Salir de la partida</button></div>
        </section>
        <section data-game-screen="result" class="game-result" aria-label="Resultado final" hidden>
            <div id="game-award-toast" class="game-award-toast" hidden></div>
            <div class="game-result-card"><span class="game-result-spark" aria-hidden="true"></span><h2 id="game-result-title" tabindex="-1">¡Juego terminado!</h2>
                <dl class="game-result-numbers"><div><dd id="game-account-points">—</dd><dt>Puntos ganados</dt></div><div><dd id="game-balance">—</dd><dt>Balance</dt></div></dl>
                <p id="game-result-label" class="game-result-label"></p><p id="game-result-rule" class="game-result-rule"></p><p id="game-result-bonus" class="game-result-bonus" hidden></p><p id="game-result-reward" class="game-result-reward"></p>
                <a id="game-collection" class="game-collection-link" href="../coleccion/coleccion.html">Mi colección</a><button type="button" id="game-replay" class="game-text-button">Volver a jugar</button>
            </div>
        </section>
        <div class="game-notices"><p id="game-loading" role="status">Preparando el campo…</p><p id="game-loading-error" role="alert" hidden></p><p id="game-resource-note" role="status" hidden></p><p id="game-network-note" role="status" hidden></p><button id="game-reconnect" type="button" hidden>Reintentar conexión</button><button id="game-demo" type="button" hidden>Practicar sin puntos</button><a id="game-login" href="../auth/login.html" hidden>Iniciar sesión</a></div>
    </div>
</main>
<div id="menu-inferior"></div>
<script type="module" src="../../js/app/main.js?v=20261101-unified"></script>
</body>
</html>
