<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zona Diamante</title>

    <link href="./css/output.css" rel="stylesheet">
    <link href="./css/juego-Style.css" rel="stylesheet">
</head>

<body class="bg-slate-900 min-h-screen">


    
    <div id="header-superior"></div>


    
    <main class="juego-content">


      
        <svg 
            class="juego-shape" 
            width="402" 
            height="285" 
            viewBox="0 0 402 285" 
            fill="none" 
            xmlns="http://www.w3.org/2000/svg"
        >
            <path 
                d="M80.4875 506.636C-190.672 361.803 -143.814 162.83 97.9712 144.662C339.757 126.494 346.014 -9.48099 446.083 0.525466C546.152 10.5319 607.712 116.893 528.319 201.21C464.806 268.664 203.301 432.933 80.4875 506.636Z" 
                fill="#DF6A16"
            />
        </svg>


        
        <div id="pantallaJuego" class="game-image">

            
            <img 
                src="./assets/img/juego/boceto-PI.png" 
                alt="Imagen del juego"
            >


            
            <button 
                class="pause-button" 
                aria-label="Pausar"
            >
                <span></span>
                <span></span>
            </button>


            
            <p class="bat-message">
                Toca la pantalla para batear
            </p>


            
            <div class="collection-container">

                <a href="pages/coleccion.html" class="collection-button" aria-label="Coleccion">
                    <img 
                        style="width: 35px; height: 35px; border-radius: 0%;" 
                        src="./assets/img/juego/collect.png" 
                        alt="colecciones"
                    >
                </a>

                <p class="collection-text">
                    Colección
                </p>

            </div>


            

            <div id="resultadoOverlay">

                <div class="resultado-contenido">

                    
                    <div class="mensaje-ganaste">
                        ¡Ganaste!
                    </div>


                    
                    <img 
                        src="./assets/img/Cartas/DoradosC.png" 
                        alt="Carta dorados"
                        class="resultado-imagen"
                    >


                    
                    <p class="resultado-texto">
                        “Jesús Loya. Equipo Dorados”<br>
                        Carta 2 de 4
                    </p>

                </div>

            </div>


        </div>


    </main>


    <!-- MENÚ INFERIOR -->
    <div id="menu-inferior"></div>


    <!-- JAVASCRIPT -->
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/ganar_juego.js"></script>


</body>

</html>
