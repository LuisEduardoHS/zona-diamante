<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./assets/logo-naranja.svg">
    <link href="./css/output.css?v=20260922-4" rel="stylesheet">
    <title>Crear cuenta | Zona Diamante</title>
</head>
<body class="h-dvh overflow-hidden bg-white text-[#2b2b31]">
    <div id="header-superior"></div>

    <main class="relative box-border h-dvh overflow-hidden px-8 pb-6 pt-[calc(112px+env(safe-area-inset-top,0px))] max-[700px]:pt-[calc(96px+env(safe-area-inset-top,0px))]">
        <h1 class="relative z-[1] m-0 text-center text-[clamp(30px,8vw,40px)] font-black leading-none">Crear cuenta</h1>

        <section class="relative z-[1] mx-auto mt-[clamp(74px,14svh,124px)] flex min-h-[calc(100dvh-280px)] w-full max-w-[430px] flex-col max-[700px]:mt-[54px]" aria-label="Formulario de creación de cuenta">
            <form id="crear-cuenta-form" class="grid gap-2">
                <p id="registro-paso" class="mb-2 text-center text-sm font-bold text-[#686870]" aria-live="polite">1 de 4</p>

                <div data-paso="0" class="grid gap-2">
                    <label class="sr-only" for="registro-correo">Correo electrónico</label>
                    <input id="registro-correo" class="box-border min-h-[58px] w-full rounded-[10px] border-2 border-[#d9d9d9] bg-white px-4 py-[13px] text-base text-[#2b2b31] outline-none placeholder:text-[#77777d] focus:border-[#008298] focus:ring-4 focus:ring-[#008298]/15" name="correo" type="email" autocomplete="email" placeholder="Correo electrónico" required>
                    <button type="button" class="registro-siguiente mt-[14px] min-h-[58px] rounded-full border-0 bg-[#f27b21] px-4 font-inherit font-extrabold text-white transition-colors hover:bg-[#d86613]">Continuar</button>
                </div>

                <div data-paso="1" class="hidden grid gap-2">
                    <label class="sr-only" for="registro-contrasena">Contraseña</label>
                    <input id="registro-contrasena" class="box-border min-h-[58px] w-full rounded-[10px] border-2 border-[#d9d9d9] bg-white px-4 py-[13px] text-base text-[#2b2b31] outline-none placeholder:text-[#77777d] focus:border-[#008298] focus:ring-4 focus:ring-[#008298]/15" name="contrasena" type="password" autocomplete="new-password" placeholder="Contraseña" required>
                    <button type="button" class="registro-siguiente mt-[14px] min-h-[58px] rounded-full border-0 bg-[#f27b21] px-4 font-inherit font-extrabold text-white transition-colors hover:bg-[#d86613]">Continuar</button>
                </div>

                <div data-paso="2" class="hidden grid gap-2">
                    <label class="sr-only" for="registro-confirmar">Confirmar contraseña</label>
                    <input id="registro-confirmar" class="box-border min-h-[58px] w-full rounded-[10px] border-2 border-[#d9d9d9] bg-white px-4 py-[13px] text-base text-[#2b2b31] outline-none placeholder:text-[#77777d] focus:border-[#008298] focus:ring-4 focus:ring-[#008298]/15" name="confirmar" type="password" autocomplete="new-password" placeholder="Confirmar contraseña" required>
                    <button type="button" class="registro-siguiente mt-[14px] min-h-[58px] rounded-full border-0 bg-[#f27b21] px-4 font-inherit font-extrabold text-white transition-colors hover:bg-[#d86613]">Continuar</button>
                </div>

                <div data-paso="3" class="hidden grid gap-2">
                    <label for="registro-foto" class="flex min-h-[120px] cursor-pointer items-center justify-center rounded-[10px] border-2 border-dashed border-[#008298] px-4 text-center font-bold text-[#008298]">Seleccionar foto
                        <input id="registro-foto" class="sr-only" name="foto" type="file" accept="image/*" required>
                    </label>
                    <p id="registro-foto-nombre" class="m-0 text-center text-sm text-[#686870]">Aún no seleccionas una foto.</p>
                    <button type="submit" class="mt-[14px] min-h-[58px] rounded-full border-0 bg-[#f27b21] px-4 font-inherit font-extrabold text-white transition-colors hover:bg-[#d86613]">Crear cuenta</button>
                </div>

                <button type="button" class="registro-anterior hidden min-h-[42px] rounded-full border border-[#008298] bg-transparent px-4 font-inherit font-extrabold text-[#008298]">Atrás</button>
                <p id="registro-estado" class="m-0 text-center text-xs text-[#008298]" role="status" aria-live="polite"></p>
            </form>
            <a class="mt-auto flex min-h-[58px] w-full items-center justify-center rounded-full border border-[#008298] text-sm font-extrabold text-[#008298] no-underline transition-colors hover:bg-[#008298]/[.08]" href="login.html">Volver a iniciar sesión</a>
        </section>
    </main>

    <div id="menu-inferior"></div>
    <script type="module" src="./js/main.js?v=20260922-3"></script>
</body>
</html>
